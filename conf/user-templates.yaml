entry-header: |
  {{#author}}
    <b>{{name}}</b><br/>
  {{/author}}
  {{#attribution}}
    {{label}}{{#reference}} {{reference}}{{/reference}}{{#names}} {{by}} <b>{{names}}</b>{{/names}}<br/>
  {{/attribution}}
  {{#source}}
    {{#problemid}}{{value}} {{/problemid}}<i>{{name}}</i>{{#issue}} <i>{{value}}</i>{{/issue}}
    {{#date}}{{#day}}{{value}}/{{/day}}{{#month}}{{value}}/{{/month}}{{#year}}{{value}}{{/year}}{{/date}}
  {{/source}}
  {{#award}}
    {{#tourney}}<br/>{{name}}{{/tourney}}
    <br/>{{distinction}}
  {{/award}}
